# Project-wide Gradle settings for JARVIS optimization.

# JVM memory and GC options tailored for 8GB system RAM & 4-core / 8-thread CPU
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1

# Parallelism and Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
org.gradle.vfs.watch=true

# Kotlin Incremental Compilation & Daemon Tuning
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.code.style=official

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.nonFinalResIds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
